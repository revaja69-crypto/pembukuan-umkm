<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NiagaPintar PRO | Cloud Sync Fixed</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-container { display: flex; height: 100dvh; width: 100%; background-color: #f8fafc; }
        .content-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; max-width: 480px; margin: 0 auto; background: white; box-shadow: 0 0 50px rgba(0,0,0,0.05); }
        @media (min-width: 1024px) { .content-wrapper { max-width: none; margin: 0; } }
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 80px; -webkit-overflow-scrolling: touch; }
        .view-section { display: none; animation: fadeIn 0.2s ease-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .premium-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: white; border-top: 1px solid #e2e8f0; display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; cursor: pointer; font-size: 9px; font-weight: 700; }
        .nav-item.active { color: #4f46e5; }
        .clickable { cursor: pointer; transition: all 0.1s; }
        .clickable:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="content-wrapper">
            <!-- Header -->
            <header class="premium-gradient text-white px-5 py-4 shrink-0">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2 rounded-xl"><i data-lucide="cloud" class="w-4 h-4"></i></div>
                        <div>
                            <h1 class="text-xs font-black uppercase">NiagaPintar PRO</h1>
                            <span id="view-title" class="text-[8px] font-bold text-indigo-200 block uppercase">DASHBOARD</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-full border border-white/10">
                        <span class="w-2 h-2 rounded-full bg-slate-400" id="status-dot"></span>
                        <span class="text-[8px] font-black uppercase tracking-widest" id="status-text">OFFLINE</span>
                    </div>
                </div>
            </header>

            <main class="main-content px-5 py-6">
                <!-- VIEW: HOME -->
                <div id="view-home" class="view-section active space-y-6">
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Masuk</span>
                            <h3 id="display-income" class="text-xs font-black text-emerald-600">Rp 0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Keluar</span>
                            <h3 id="display-expense" class="text-xs font-black text-rose-600">Rp 0</h3>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-3xl shadow-lg">
                            <span class="text-[8px] font-bold text-slate-500 uppercase block mb-1">Saldo</span>
                            <h3 id="display-balance" class="text-xs font-black text-white">Rp 0</h3>
                        </div>
                    </div>
                    <div id="visual-lists" class="space-y-4"></div>
                    <div id="empty-state" class="hidden py-20 text-center"><p class="text-[10px] font-bold text-slate-300 uppercase">Belum ada data</p></div>
                </div>

                <!-- VIEW: INPUT -->
                <div id="view-input" class="view-section space-y-6">
                    <form id="accounting-form" class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                        <input type="text" id="desc" placeholder="Keterangan..." required class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="setType('income')" id="btn-inc" class="p-4 rounded-2xl border-2 border-slate-100 font-bold text-[10px]">💰 MASUK</button>
                            <button type="button" onclick="setType('expense')" id="btn-exp" class="p-4 rounded-2xl border-2 border-slate-100 font-bold text-[10px]">💸 KELUAR</button>
                        </div>
                        <input type="hidden" id="type" value="income">
                        <input type="number" id="amount" placeholder="Nominal..." required class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none">
                        <select id="category" class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none"></select>
                        <input type="date" id="date" required class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none">
                        <button type="submit" id="sub-btn" class="w-full p-5 bg-indigo-600 text-white rounded-[2rem] font-black text-xs clickable">SIMPAN KE CLOUD</button>
                    </form>
                </div>

                <!-- VIEW: HISTORY -->
                <div id="view-history" class="view-section space-y-4">
                    <div class="flex gap-2">
                        <button onclick="exportData('pdf')" class="flex-1 p-3 bg-white border rounded-xl text-[9px] font-bold">PDF</button>
                        <button onclick="exportData('excel')" class="flex-1 p-3 bg-white border rounded-xl text-[9px] font-bold">EXCEL</button>
                    </div>
                    <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden">
                        <table class="w-full text-left text-[10px]">
                            <tbody id="list-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

                <!-- VIEW: SETTINGS -->
                <div id="view-settings" class="view-section space-y-4">
                    <div class="bg-white p-6 rounded-3xl border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-2">ID Niaga Anda</p>
                        <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                            <span id="display-id" class="font-bold tracking-widest text-sm">0000000000</span>
                            <i data-lucide="copy" class="w-4 h-4 text-indigo-600 clickable" onclick="copyId()"></i>
                        </div>
                        <div class="mt-4 space-y-2">
                            <input type="number" id="id-input" placeholder="Ganti ke ID lain (10 digit)" class="w-full p-4 border rounded-2xl text-xs">
                            <button onclick="changeId()" class="w-full p-4 bg-indigo-600 text-white rounded-2xl font-bold text-[10px]">HUBUNGKAN</button>
                        </div>
                    </div>
                </div>
            </main>

            <nav class="bottom-nav">
                <div class="nav-item active" id="nav-home" onclick="switchView('home')"><i data-lucide="layout-grid" class="w-5 h-5"></i><span>Beranda</span></div>
                <div class="nav-item" id="nav-input" onclick="switchView('input')"><i data-lucide="plus-circle" class="w-5 h-5"></i><span>Catat</span></div>
                <div class="nav-item" id="nav-history" onclick="switchView('history')"><i data-lucide="clock-3" class="w-5 h-5"></i><span>Riwayat</span></div>
                <div class="nav-item" id="nav-settings" onclick="switchView('settings')"><i data-lucide="settings-2" class="w-5 h-5"></i><span>Sistem</span></div>
            </nav>
        </div>
    </div>

    <div id="notif" class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] opacity-0 transition-all pointer-events-none bg-slate-900 text-white px-6 py-2 rounded-full text-[10px] font-bold"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIG & INIT
        const config = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-id';
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // STATE
        let activeId = localStorage.getItem('active_id') || (() => {
            const id = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            localStorage.setItem('active_id', id);
            return id;
        })();
        let records = [];
        let categories = [];
        let unsubT = null;

        // AUTH GUARD
        const startApp = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                updateStatus(false);
                setTimeout(startApp, 3000);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Auth Success:", user.uid);
                syncData(activeId);
            } else {
                updateStatus(false);
            }
        });

        // SYNC LOGIC (RULE 1 Path Compliance)
        function syncData(id) {
            if (unsubT) unsubT();
            // Path: artifacts/{appId}/public/data/{collection}
            const path = `artifacts/${appId}/public/data/trans_${id}`;
            const col = collection(db, path);

            unsubT = onSnapshot(col, (snap) => {
                records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
                updateStatus(true);
            }, (err) => {
                console.error("Firebase Permission Error:", err);
                updateStatus(false);
                // If permission denied, likely path structure or auth issue
            });

            document.getElementById('display-id').innerText = id;
            document.getElementById('display-id').innerText = id.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
        }

        function updateStatus(online) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const sDot = document.getElementById('sync-status-dot');
            const sTxt = document.getElementById('sync-status-text');
            
            const isReallyOnline = online && navigator.onLine;
            const color = isReallyOnline ? 'bg-emerald-400' : 'bg-slate-400';
            
            if (dot) dot.className = `w-2 h-2 rounded-full ${color}`;
            if (txt) txt.innerText = isReallyOnline ? 'CONNECTED' : 'OFFLINE';
            if (sDot) sDot.className = `w-2 h-2 rounded-full ${color}`;
            if (sTxt) sTxt.innerText = isReallyOnline ? 'CLOUD ONLINE' : 'OFFLINE MODE';
        }

        // UI ACTIONS
        window.switchView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById('view-title').innerText = v.toUpperCase();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            lucide.createIcons();
        };

        window.setType = (t) => {
            document.getElementById('type').value = t;
            document.getElementById('btn-inc').className = `p-4 rounded-2xl border-2 font-bold text-[10px] ${t==='income'?'bg-emerald-500 text-white border-emerald-500':'bg-white text-slate-400 border-slate-100'}`;
            document.getElementById('btn-exp').className = `p-4 rounded-2xl border-2 font-bold text-[10px] ${t==='expense'?'bg-rose-500 text-white border-rose-500':'bg-white text-slate-400 border-slate-100'}`;
            const cats = t === 'income' ? ['Penjualan', 'Modal', 'Piutang'] : ['Stok', 'Gaji', 'Sewa', 'Lainnya'];
            document.getElementById('category').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        };

        window.copyId = () => {
            navigator.clipboard.writeText(activeId);
            const n = document.getElementById('notif');
            n.innerText = "ID DISALIN"; n.classList.remove('opacity-0');
            setTimeout(() => n.classList.add('opacity-0'), 2000);
        };

        window.changeId = () => {
            const val = document.getElementById('id-input').value;
            if (val.length !== 10) return alert("Harus 10 digit");
            activeId = val;
            localStorage.setItem('active_id', val);
            syncData(val);
            switchView('home');
        };

        document.getElementById('accounting-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return alert("Belum terhubung ke Cloud");
            const btn = document.getElementById('sub-btn');
            btn.disabled = true; btn.innerText = "MENYIMPAN...";
            
            const data = {
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                timestamp: serverTimestamp()
            };

            try {
                const path = `artifacts/${appId}/public/data/trans_${activeId}`;
                await addDoc(collection(db, path), data);
                document.getElementById('accounting-form').reset();
                setType('income');
                switchView('history');
            } catch (err) {
                alert("Gagal simpan: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = "SIMPAN KE CLOUD";
            }
        };

        function renderUI() {
            const list = document.getElementById('list-body');
            list.innerHTML = records.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => `
                <tr class="group">
                    <td class="px-6 py-4 font-bold text-slate-400">${r.date.split('-').slice(1).reverse().join('/')}</td>
                    <td class="px-2 py-4">
                        <span class="font-black text-slate-800 block">${r.desc}</span>
                        <span class="text-[8px] font-bold text-slate-300 uppercase">${r.category}</span>
                    </td>
                    <td class="px-6 py-4 text-right font-black ${r.type==='income'?'text-emerald-500':'text-rose-500'}">
                        ${new Intl.NumberFormat('id-ID').format(r.amount)}
                    </td>
                </tr>
            `).join('');

            const tInc = records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
            const tExp = records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
            document.getElementById('display-income').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(tInc);
            document.getElementById('display-expense').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(tExp);
            document.getElementById('display-balance').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(tInc-tExp);
        }

        // INIT
        setType('income');
        document.getElementById('date').valueAsDate = new Date();
        startApp();
        lucide.createIcons();
    </script>
</body>
</html>
