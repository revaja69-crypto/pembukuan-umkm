<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NiagaPintar PRO | Full Feature Stable Sync</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11550/11550419.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand: #4f46e5;
            --emerald: #10b981;
            --rose: #f43f5e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100dvh;
            width: 100%;
            background-color: #f8fafc;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background-color: #f8fafc;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 0 100px rgba(0,0,0,0.05);
        }

        @media (min-width: 1024px) {
            .content-wrapper { max-width: none; margin: 0; border-left: 1px solid #e2e8f0; }
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
            -webkit-overflow-scrolling: touch;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            border-top: 1px solid #e2e8f0;
            display: flex; 
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item-mobile {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: pointer;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-item-mobile.active { color: var(--brand); }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #sync-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        
        .loader-ring {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--brand);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-action {
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .btn-action:active { transform: scale(0.95); opacity: 0.8; }

        .progress-bar {
            height: 4px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="text-slate-900">

    <div id="sync-overlay">
        <div class="loader-ring"></div>
        <p class="mt-4 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Sinkronisasi Cloud...</p>
        <button onclick="hideOverlay()" class="mt-8 px-6 py-2 border border-slate-200 rounded-full text-[9px] font-bold text-slate-500 uppercase tracking-widest hover:bg-slate-50">Lewati & Gunakan Offline</button>
    </div>

    <div class="app-container">
        <div class="content-wrapper">
            <header class="premium-gradient text-white px-5 py-4 shrink-0">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2 rounded-xl">
                            <i data-lucide="zap" class="w-4 h-4 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xs font-black uppercase tracking-tight">NiagaPintar PRO</h1>
                            <span id="view-title" class="text-[8px] font-bold text-indigo-200 block uppercase tracking-widest">DASHBOARD</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-1.5 bg-black/20 px-3 py-1 rounded-full border border-white/10">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-400" id="sync-dot"></span>
                            <span class="text-[8px] font-black text-white uppercase" id="sync-text">OFFLINE</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="main-content px-5 py-6">
                <!-- BERANDA -->
                <div id="view-home" class="view-section active space-y-6">
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Masuk</span>
                            <h3 id="display-income" class="text-xs font-black text-slate-900 tracking-tighter">Rp 0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Keluar</span>
                            <h3 id="display-expense" class="text-xs font-black text-slate-900 tracking-tighter">Rp 0</h3>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-3xl shadow-lg">
                            <span class="text-[8px] font-bold text-slate-500 uppercase block mb-1">Saldo</span>
                            <h3 id="display-balance" class="text-xs font-black text-white tracking-tighter">Rp 0</h3>
                        </div>
                    </div>

                    <div id="visual-stats" class="space-y-4"></div>
                    <div id="home-empty" class="hidden py-16 text-center opacity-30">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        <p class="text-[10px] font-bold uppercase tracking-widest">Belum ada data</p>
                    </div>
                </div>

                <!-- INPUT -->
                <div id="view-input" class="view-section">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-5">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
                            <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest">Catat Baru</h2>
                        </div>
                        <form id="accounting-form" class="space-y-4">
                            <input type="text" id="desc" placeholder="Keterangan..." required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm outline-none">
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="setT('income')" id="btn-t-inc" class="p-4 rounded-2xl border-2 font-bold text-[10px] uppercase">💰 MASUK</button>
                                <button type="button" onclick="setT('expense')" id="btn-t-exp" class="p-4 rounded-2xl border-2 font-bold text-[10px] uppercase">💸 KELUAR</button>
                            </div>
                            <input type="hidden" id="type" value="income">
                            <input type="number" id="amount" placeholder="Nominal Rp..." required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-black outline-none">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="category" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm"></select>
                                <input type="date" id="date" required class="p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm">
                            </div>
                            <button type="submit" id="submit-btn" class="w-full p-5 bg-indigo-600 text-white rounded-[2rem] font-black text-xs shadow-lg btn-action">SIMPAN TRANSAKSI</button>
                        </form>
                    </div>
                </div>

                <!-- HISTORY -->
                <div id="view-history" class="view-section space-y-4">
                    <div class="flex gap-2">
                        <button onclick="exportDoc('pdf')" class="flex-1 p-3 bg-white border border-slate-100 rounded-2xl text-[9px] font-bold uppercase text-slate-500 hover:bg-slate-50">Unduh PDF</button>
                        <button onclick="exportDoc('xlsx')" class="flex-1 p-3 bg-white border border-slate-100 rounded-2xl text-[9px] font-bold uppercase text-slate-500 hover:bg-slate-50">Unduh Excel</button>
                    </div>
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="text" id="search-bar" oninput="renderUI()" placeholder="Cari transaksi..." class="w-full pl-12 pr-4 py-3 bg-white border border-slate-100 rounded-2xl text-xs outline-none">
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm">
                        <table class="w-full text-left text-[11px]">
                            <tbody id="list-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

                <!-- SETTINGS -->
                <div id="view-settings" class="view-section space-y-6">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">User NiagaID</p>
                        <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl">
                            <span id="display-uid" class="font-black tracking-[0.2em] text-xs">0000000000</span>
                            <i data-lucide="copy" class="w-4 h-4 text-indigo-600 cursor-pointer" onclick="copyUID()"></i>
                        </div>
                        <div class="pt-4 border-t space-y-3">
                            <input type="number" id="input-uid" placeholder="Ganti ID (10 Angka)" class="w-full p-4 border rounded-2xl text-xs outline-none">
                            <button onclick="switchUID()" class="w-full p-4 bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase">Ganti Perangkat</button>
                        </div>
                    </div>

                    <!-- KELOLA KATEGORI -->
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm space-y-4">
                        <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest flex items-center gap-2"><i data-lucide="tags" class="w-4 h-4 text-indigo-600"></i> Kelola Kategori</h2>
                        <div class="flex gap-2">
                            <input type="text" id="new-cat-name" placeholder="Nama kategori..." class="flex-1 p-3 bg-slate-50 border rounded-xl text-xs outline-none">
                            <select id="new-cat-type" class="bg-slate-50 border p-3 rounded-xl text-xs font-bold">
                                <option value="income">Masuk</option>
                                <option value="expense">Keluar</option>
                            </select>
                            <button onclick="addCat()" class="bg-indigo-600 text-white p-3 rounded-xl btn-action"><i data-lucide="plus" class="w-4 h-4"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div id="list-cat-inc" class="space-y-1"></div>
                            <div id="list-cat-exp" class="space-y-1"></div>
                        </div>
                    </div>
                </div>
            </main>

            <nav class="bottom-nav">
                <div class="nav-item-mobile active" id="nav-home" onclick="switchView('home')"><i data-lucide="home" class="w-5 h-5"></i><span>Home</span></div>
                <div class="nav-item-mobile" id="nav-input" onclick="switchView('input')"><i data-lucide="plus-circle" class="w-5 h-5"></i><span>Catat</span></div>
                <div class="nav-item-mobile" id="nav-history" onclick="switchView('history')"><i data-lucide="list" class="w-5 h-5"></i><span>Laporan</span></div>
                <div class="nav-item-mobile" id="nav-settings" onclick="switchView('settings')"><i data-lucide="settings" class="w-5 h-5"></i><span>Sistem</span></div>
            </nav>
        </div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[10000] opacity-0 transition-all pointer-events-none bg-slate-900 text-white px-8 py-3 rounded-full text-[10px] font-bold uppercase tracking-widest">Berhasil</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.records = JSON.parse(localStorage.getItem('np_local_recs') || '[]');
        window.cats = JSON.parse(localStorage.getItem('np_local_cats') || '[]');
        let currentUID = localStorage.getItem('np_active_uid') || (() => {
            const id = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            localStorage.setItem('np_active_uid', id);
            return id;
        })();

        // Firebase Initialization
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-id';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let unsubRecs = null;
        let unsubCats = null;

        window.hideOverlay = () => {
            const overlay = document.getElementById('sync-overlay');
            if(overlay) { overlay.style.opacity = '0'; setTimeout(() => overlay.style.visibility = 'hidden', 400); }
        };

        window.notify = (m) => {
            const t = document.getElementById('toast');
            if(t) { t.innerText = m; t.classList.remove('opacity-0'); setTimeout(() => t.classList.add('opacity-0'), 3000); }
        };

        window.renderUI = () => {
            const fmt = (v) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(v);
            const query = document.getElementById('search-bar')?.value.toLowerCase() || "";
            const list = document.getElementById('list-body');
            
            const filtered = window.records.filter(r => (r.desc || "").toLowerCase().includes(query) || (r.category || "").toLowerCase().includes(query))
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            if(list) {
                list.innerHTML = filtered.map(r => `
                    <tr class="group">
                        <td class="px-6 py-4 font-bold text-slate-400">${r.date.split('-').reverse().slice(0,2).join('/')}</td>
                        <td class="px-2 py-4">
                            <span class="font-black text-slate-800 block truncate max-w-[120px] mb-1">${r.desc}</span>
                            <span class="text-[8px] font-bold text-slate-300 uppercase tracking-widest">${r.category}</span>
                        </td>
                        <td class="px-4 py-4 text-right font-black ${r.type==='income'?'text-emerald-500':'text-rose-500'}">${fmt(r.amount).replace('Rp', '')}</td>
                        <td class="px-4 py-4 text-center">
                            <button onclick="delRec('${r.id}')" class="text-slate-200 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `).join('');
            }

            const inc = window.records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
            const exp = window.records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
            document.getElementById('display-income').innerText = fmt(inc);
            document.getElementById('display-expense').innerText = fmt(exp);
            document.getElementById('display-balance').innerText = fmt(inc - exp);
            document.getElementById('home-empty').classList.toggle('hidden', window.records.length > 0);
            renderStats(inc, exp, fmt);
            lucide.createIcons();
        };

        const renderStats = (tInc, tExp, fmt) => {
            const container = document.getElementById('visual-stats');
            if(!container || window.records.length === 0) return;
            const data = {};
            window.records.forEach(r => { const k = `${r.type}:${r.category}`; data[k] = (data[k] || 0) + r.amount; });
            container.innerHTML = Object.keys(data).sort((a,b) => data[b] - data[a]).slice(0, 3).map(k => {
                const [type, name] = k.split(':');
                const total = type === 'income' ? tInc : tExp;
                const perc = total > 0 ? Math.round((data[k]/total)*100) : 0;
                const color = type === 'income' ? '#10b981' : '#f43f5e';
                return `
                    <div class="bg-white p-4 rounded-3xl border border-slate-50 shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-black text-slate-800 uppercase tracking-widest leading-none">${name}</span>
                            <span class="text-[10px] font-black text-slate-900">${fmt(data[k])}</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${perc}%; background-color: ${color}"></div></div>
                    </div>
                `;
            }).join('');
        };

        const renderCatsUI = () => {
            const incL = document.getElementById('list-cat-inc');
            const expL = document.getElementById('list-cat-exp');
            if(!incL || !expL) return;
            const ui = (c) => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100 mb-1">
                    <span class="text-[9px] font-bold text-slate-600 uppercase">${c.name}</span>
                    <button onclick="delCat('${c.id}')" class="text-slate-300 hover:text-rose-500"><i data-lucide="x-circle" class="w-3 h-3"></i></button>
                </div>`;
            incL.innerHTML = window.cats.filter(c => c.type === 'income').map(ui).join('');
            expL.innerHTML = window.cats.filter(c => c.type === 'expense').map(ui).join('');
            lucide.createIcons();
        };

        const startSync = (uid) => {
            // Rule 3: Guard Firestore access behind auth status
            if (!auth.currentUser) return;

            if (unsubRecs) unsubRecs();
            if (unsubCats) unsubCats();

            // Rule 1: Correct Firestore paths
            const pathRecs = `artifacts/${appId}/public/data/recs_${uid}`;
            const pathCats = `artifacts/${appId}/public/data/cats_${uid}`;

            unsubRecs = onSnapshot(collection(db, pathRecs), (snap) => {
                window.records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                localStorage.setItem('np_local_recs', JSON.stringify(window.records));
                window.renderUI();
                document.getElementById('sync-dot').className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('sync-text').innerText = "CONNECTED";
                window.hideOverlay();
            }, (err) => {
                console.error("Firestore sync error (recs):", err);
                document.getElementById('sync-dot').className = "w-1.5 h-1.5 rounded-full bg-slate-400";
                document.getElementById('sync-text').innerText = "OFFLINE";
            });

            unsubCats = onSnapshot(collection(db, pathCats), (snap) => {
                const fetched = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if(fetched.length === 0 && uid === currentUID) seedCats(uid);
                else {
                    window.cats = fetched;
                    localStorage.setItem('np_local_cats', JSON.stringify(window.cats));
                    renderCatsUI();
                    window.setT(document.getElementById('type').value);
                }
            }, (err) => {
                console.error("Firestore sync error (cats):", err);
            });

            document.getElementById('display-uid').innerText = uid;
        };

        const seedCats = async (uid) => {
            if (!auth.currentUser) return;
            const def = [
                { type: 'income', name: 'Penjualan' }, { type: 'income', name: 'Modal' },
                { type: 'expense', name: 'Stok' }, { type: 'expense', name: 'Sewa' }, { type: 'expense', name: 'Gaji' }
            ];
            for (const c of def) await addDoc(collection(db, `artifacts/${appId}/public/data/cats_${uid}`), c);
        };

        // Rule 3: Auth Flow Implementation
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Authentication failed:", err);
                window.hideOverlay();
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) startSync(currentUID);
        });

        initAuth();

        window.switchView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById('view-title').innerText = v.toUpperCase();
            document.querySelectorAll('.nav-item-mobile').forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            window.renderUI();
            if(v === 'settings') renderCatsUI();
        };

        window.setT = (t) => {
            document.getElementById('type').value = t;
            document.getElementById('btn-t-inc').className = `p-4 rounded-2xl border-2 font-bold text-[10px] uppercase transition-all ${t==='income'?'bg-emerald-500 text-white border-emerald-500':'bg-white text-slate-300 border-slate-100'}`;
            document.getElementById('btn-t-exp').className = `p-4 rounded-2xl border-2 font-bold text-[10px] uppercase transition-all ${t==='expense'?'bg-rose-500 text-white border-rose-500':'bg-white text-slate-300 border-slate-100'}`;
            const filtered = window.cats.filter(c => c.type === t);
            document.getElementById('category').innerHTML = filtered.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        };

        window.copyUID = () => { navigator.clipboard.writeText(currentUID); window.notify("ID DISALIN"); };
        window.switchUID = () => {
            const v = document.getElementById('input-uid').value;
            if(v.length !== 10) return alert("ID harus 10 angka");
            currentUID = v;
            localStorage.setItem('np_active_uid', v);
            if (auth.currentUser) startSync(v);
            window.switchView('home');
            window.notify("SWITCHING...");
        };

        window.addCat = async () => {
            if (!auth.currentUser) return window.notify("TIDAK TERKONEKSI");
            const name = document.getElementById('new-cat-name').value.trim();
            const type = document.getElementById('new-cat-type').value;
            if(!name) return;
            try {
                await addDoc(collection(db, `artifacts/${appId}/public/data/cats_${currentUID}`), { name, type });
                document.getElementById('new-cat-name').value = '';
                window.notify("KATEGORI DITAMBAH");
            } catch { window.notify("GAGAL"); }
        };

        window.delCat = async (id) => {
            if (!auth.currentUser) return window.notify("TIDAK TERKONEKSI");
            if(!confirm("Hapus kategori?")) return;
            try { await deleteDoc(doc(db, `artifacts/${appId}/public/data/cats_${currentUID}`, id)); window.notify("KATEGORI DIHAPUS"); }
            catch { window.notify("GAGAL"); }
        };

        window.delRec = async (id) => {
            if (!auth.currentUser && !id.startsWith('L-')) return window.notify("TIDAK TERKONEKSI");
            if(!confirm("Hapus transaksi?")) return;
            try { 
                if (!id.startsWith('L-')) {
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/recs_${currentUID}`, id)); 
                } else {
                    window.records = window.records.filter(r => r.id !== id);
                    localStorage.setItem('np_local_recs', JSON.stringify(window.records));
                    window.renderUI();
                }
                window.notify("TERHAPUS"); 
            }
            catch { window.notify("GAGAL"); }
        };

        document.getElementById('accounting-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "...";
            const data = {
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                timestamp: serverTimestamp()
            };
            try {
                if(!auth.currentUser) throw new Error("Offline");
                await addDoc(collection(db, `artifacts/${appId}/public/data/recs_${currentUID}`), data);
                window.notify("TERSINKRON");
            } catch {
                window.records.push({ id: 'L-'+Date.now(), ...data });
                localStorage.setItem('np_local_recs', JSON.stringify(window.records));
                window.renderUI(); window.notify("SIMPAN LOKAL");
            } finally {
                btn.disabled = false; btn.innerText = "SIMPAN TRANSAKSI";
                document.getElementById('accounting-form').reset();
                window.switchView('history');
            }
        };

        window.exportDoc = (type) => {
            if(type === 'pdf') {
                const { jsPDF } = window.jspdf;
                const docPdf = new jsPDF();
                docPdf.text("Laporan NiagaPintar PRO", 14, 20);
                docPdf.autoTable({ startY: 25, head: [['Tgl', 'Ket', 'Ktg', 'Rp']], body: window.records.map(r=>[r.date, r.desc, r.category, r.amount]) });
                docPdf.save(`Laporan_${currentUID}.pdf`);
            } else {
                const ws = XLSX.utils.json_to_sheet(window.records);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Data");
                XLSX.writeFile(wb, `Laporan_${currentUID}.xlsx`);
            }
        };

        window.setT('income');
        document.getElementById('date').valueAsDate = new Date();
        window.renderUI();
        setTimeout(window.hideOverlay, 4000);
    </script>
</body>
</html>
