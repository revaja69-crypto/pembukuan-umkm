<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NiagaPintar PRO | Enterprise Edition</title>
    
    <!-- PWA & Mobile Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11550/11550419.png">

    <!-- Pustaka Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-container { display: flex; height: 100dvh; width: 100%; }
        .content-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; max-width: 500px; margin: 0 auto; background: white; box-shadow: 0 0 40px rgba(0,0,0,0.03); }
        @media (min-width: 1024px) { .content-wrapper { max-width: none; margin: 0; } }
        .main-content { flex: 1; overflow-y: auto; padding-bottom: 80px; -webkit-overflow-scrolling: touch; }
        .view-section { display: none; animation: fadeIn 0.2s ease-out forwards; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .premium-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid #f1f5f9; display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
        .nav-item.active { color: #4f46e5; }
        .clickable { cursor: pointer; transition: transform 0.1s; pointer-events: auto !important; }
        .clickable:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="content-wrapper">
            <!-- Header -->
            <header class="premium-gradient text-white px-5 py-5 shrink-0 shadow-lg">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-white/20 p-2.5 rounded-2xl"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></div>
                        <div>
                            <h1 class="text-sm font-black uppercase tracking-tight">NiagaPintar PRO</h1>
                            <span id="view-title" class="text-[9px] font-bold text-indigo-100 block opacity-80 uppercase tracking-widest">BERANDA</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 bg-black/10 px-3 py-1.5 rounded-full border border-white/10">
                        <span class="w-2 h-2 rounded-full bg-slate-400" id="status-dot"></span>
                        <span class="text-[9px] font-black uppercase tracking-tighter" id="status-text">OFFLINE</span>
                    </div>
                </div>
            </header>

            <main class="main-content px-5 py-6">
                <!-- VIEW: HOME -->
                <div id="view-home" class="view-section active space-y-6">
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Masuk</span>
                            <h3 id="display-income" class="text-xs font-black text-emerald-600 tracking-tighter">Rp 0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
                            <span class="text-[8px] font-bold text-slate-400 uppercase block mb-1">Keluar</span>
                            <h3 id="display-expense" class="text-xs font-black text-rose-600 tracking-tighter">Rp 0</h3>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-3xl shadow-lg">
                            <span class="text-[8px] font-bold text-slate-500 uppercase block mb-1">Saldo</span>
                            <h3 id="display-balance" class="text-xs font-black text-white tracking-tighter">Rp 0</h3>
                        </div>
                    </div>
                    
                    <div id="stats-container" class="space-y-4"></div>
                    <div id="home-empty" class="hidden py-24 text-center opacity-30"><i data-lucide="box" class="w-12 h-12 mx-auto mb-2"></i><p class="text-[10px] font-black uppercase">Belum ada data</p></div>
                </div>

                <!-- VIEW: INPUT -->
                <div id="view-input" class="view-section space-y-6">
                    <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <h2 class="text-xs font-black text-slate-800 uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i> Tambah Transaksi</h2>
                        <form id="main-form" class="space-y-4">
                            <input type="text" id="form-desc" placeholder="Keterangan..." required class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                            
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="setType('income')" id="btn-type-inc" class="p-4 rounded-2xl border-2 font-black text-[10px] uppercase transition-all">💰 Masuk</button>
                                <button type="button" onclick="setType('expense')" id="btn-type-exp" class="p-4 rounded-2xl border-2 font-black text-[10px] uppercase transition-all">💸 Keluar</button>
                            </div>
                            <input type="hidden" id="form-type" value="income">

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="number" id="form-amount" placeholder="Nominal..." required class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-black outline-none">
                                <input type="date" id="form-date" required class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none">
                            </div>
                            
                            <select id="form-cat" class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none"></select>
                            
                            <button type="submit" id="submit-btn" class="w-full p-5 bg-indigo-600 text-white rounded-[2rem] font-black text-xs shadow-xl shadow-indigo-100 clickable">SIMPAN KE CLOUD</button>
                        </form>
                    </div>
                </div>

                <!-- VIEW: HISTORY -->
                <div id="view-history" class="view-section space-y-4">
                    <div class="flex gap-2">
                        <button onclick="exportDoc('pdf')" class="flex-1 p-3.5 bg-white border border-slate-100 rounded-2xl text-[10px] font-black uppercase tracking-tighter shadow-sm flex items-center justify-center gap-2 text-rose-500"><i data-lucide="file-text" class="w-4 h-4"></i> PDF</button>
                        <button onclick="exportDoc('excel')" class="flex-1 p-3.5 bg-white border border-slate-100 rounded-2xl text-[10px] font-black uppercase tracking-tighter shadow-sm flex items-center justify-center gap-2 text-emerald-600"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel</button>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm">
                        <table class="w-full text-left text-[11px]">
                            <tbody id="history-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

                <!-- VIEW: SETTINGS -->
                <div id="view-settings" class="view-section space-y-6">
                    <div class="bg-white p-7 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-5">
                        <div class="space-y-1">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">ID Niaga PRO Anda</p>
                            <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <span id="display-id" class="font-black text-sm tracking-[0.2em] text-slate-800">000 000 0000</span>
                                <i data-lucide="copy" class="w-5 h-5 text-indigo-600 clickable" onclick="copyMyId()"></i>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <p class="text-[10px] font-black text-slate-800 uppercase tracking-widest">Sinkronisasi ID Lain</p>
                            <div class="flex gap-2">
                                <input type="number" id="id-switcher" placeholder="10 Digit ID" class="flex-1 p-4 bg-slate-50 rounded-2xl text-xs font-bold outline-none border border-slate-100">
                                <button onclick="switchId()" class="px-6 bg-indigo-600 text-white rounded-2xl font-black text-[10px] uppercase clickable">GANTI</button>
                            </div>
                        </div>
                    </div>
                    <button onclick="clearCloud()" class="w-full p-5 bg-rose-50 text-rose-500 rounded-[2rem] font-black text-[10px] uppercase tracking-widest border border-rose-100 clickable">Hapus Seluruh Data</button>
                </div>
            </main>

            <nav class="bottom-nav">
                <div class="nav-item active clickable" id="nav-home" onclick="switchView('home')"><i data-lucide="layout-grid" class="w-5 h-5"></i><span>Beranda</span></div>
                <div class="nav-item clickable" id="nav-input" onclick="switchView('input')"><i data-lucide="plus-circle" class="w-5 h-5"></i><span>Catat</span></div>
                <div class="nav-item clickable" id="nav-history" onclick="switchView('history')"><i data-lucide="clock-3" class="w-5 h-5"></i><span>Riwayat</span></div>
                <div class="nav-item clickable" id="nav-settings" onclick="switchView('settings')"><i data-lucide="settings-2" class="w-5 h-5"></i><span>Sistem</span></div>
            </nav>
        </div>
    </div>

    <!-- NOTIFIKASI -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[1000] opacity-0 transition-all pointer-events-none bg-slate-900 text-white px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-widest shadow-2xl">BERHASIL</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // GLOBAL UTILS (Available immediately for UI)
        window.records = JSON.parse(localStorage.getItem('np_rec') || '[]');
        window.activeView = 'home';
        
        const config = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-id';
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ID LOGIC
        const getMyId = () => {
            let id = localStorage.getItem('np_id_10');
            if (!id) {
                id = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                localStorage.setItem('np_id_10', id);
            }
            return id;
        };
        const myId = getMyId();
        let currentId = localStorage.getItem('np_active_id') || myId;
        let unsub = null;

        // UI HELPERS
        const formatIDR = (v) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(v);
        
        window.showToast = (t) => {
            const el = document.getElementById('toast');
            el.innerText = t; el.classList.remove('opacity-0');
            setTimeout(() => el.classList.add('opacity-0'), 2500);
        };

        window.updateStatus = (online) => {
            const isReallyOnline = online && navigator.onLine;
            const color = isReallyOnline ? 'bg-emerald-400' : 'bg-slate-400';
            document.getElementById('status-dot').className = `w-2 h-2 rounded-full ${color}`;
            document.getElementById('status-text').innerText = isReallyOnline ? 'CONNECTED' : 'OFFLINE';
        };

        window.renderUI = () => {
            const list = document.getElementById('history-body');
            if (list) {
                list.innerHTML = window.records.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => `
                    <tr class="group">
                        <td class="px-6 py-5 font-bold text-slate-300 text-[10px]">${r.date.split('-').slice(1).reverse().join('/')}</td>
                        <td class="px-2 py-5">
                            <span class="font-black text-slate-800 block leading-tight truncate max-w-[140px] mb-1">${r.desc}</span>
                            <span class="text-[8px] font-black text-slate-300 uppercase tracking-widest">${r.category}</span>
                        </td>
                        <td class="px-6 py-5 text-right font-black ${r.type==='income'?'text-emerald-500':'text-rose-500'}">
                            ${formatIDR(r.amount).replace('Rp', '')}
                        </td>
                    </tr>
                `).join('');
            }

            const tInc = window.records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
            const tExp = window.records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
            document.getElementById('display-income').innerText = formatIDR(tInc);
            document.getElementById('display-expense').innerText = formatIDR(tExp);
            document.getElementById('display-balance').innerText = formatIDR(tInc-tExp);
            document.getElementById('home-empty').classList.toggle('hidden', window.records.length > 0);
            
            renderStats(tInc, tExp);
            if (window.lucide) lucide.createIcons();
        };

        const renderStats = (tInc, tExp) => {
            const container = document.getElementById('stats-container');
            if (!container || window.records.length === 0) return;
            
            const cats = {};
            window.records.forEach(r => {
                const k = `${r.type}:${r.category}`;
                cats[k] = (cats[k] || 0) + r.amount;
            });

            container.innerHTML = Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).slice(0,4).map(k => {
                const [type, name] = k.split(':');
                const total = type === 'income' ? tInc : tExp;
                const perc = total > 0 ? Math.round((cats[k]/total)*100) : 0;
                const color = type === 'income' ? '#10b981' : '#f43f5e';
                return `
                    <div class="bg-white p-5 rounded-[2rem] border border-slate-50 flex flex-col gap-3 shadow-sm">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-2xl bg-slate-50 flex items-center justify-center"><i data-lucide="${type==='income'?'trending-up':'trending-down'}" class="w-4 h-4" style="color:${color}"></i></div>
                                <div class="flex flex-col"><span class="text-[10px] font-black text-slate-800 uppercase leading-none mb-1">${name}</span><span class="text-[8px] font-bold text-slate-300 uppercase">${perc}% Porsi</span></div>
                            </div>
                            <span class="text-[11px] font-black text-slate-900">${formatIDR(cats[k])}</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-50 rounded-full overflow-hidden"><div class="h-full" style="width:${perc}%; background-color:${color}"></div></div>
                    </div>
                `;
            }).join('');
        };

        // CLOUD CORE (RULE 3 Compliance)
        const sync = (id) => {
            if (unsub) unsub();
            // RULE 1: Strict Path artifacts/{appId}/public/data/{collection}
            const path = `artifacts/${appId}/public/data/niaga_v7_${id}`;
            unsub = onSnapshot(collection(db, path), (snap) => {
                window.records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                localStorage.setItem('np_rec', JSON.stringify(window.records));
                window.renderUI();
                window.updateStatus(true);
            }, (err) => {
                console.warn("Cloud offline/unauthorized", err);
                window.updateStatus(false);
            });

            document.getElementById('display-id').innerText = id.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
        };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth failed", e);
                window.updateStatus(false);
                setTimeout(initAuth, 3000);
            }
        };

        onAuthStateChanged(auth, (user) => { if (user) sync(currentId); });

        // EXPOSED FUNCTIONS
        window.switchView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById('view-title').innerText = v.toUpperCase();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            window.renderUI();
        };

        window.setType = (t) => {
            document.getElementById('form-type').value = t;
            document.getElementById('btn-type-inc').className = `p-4 rounded-2xl border-2 font-black text-[10px] uppercase transition-all ${t==='income'?'bg-emerald-500 text-white border-emerald-500':'bg-white text-slate-300 border-slate-50'}`;
            document.getElementById('btn-type-exp').className = `p-4 rounded-2xl border-2 font-black text-[10px] uppercase transition-all ${t==='expense'?'bg-rose-500 text-white border-rose-500':'bg-white text-slate-300 border-slate-50'}`;
            const cats = t === 'income' ? ['Penjualan', 'Modal', 'Piutang'] : ['Stok Barang', 'Gaji', 'Sewa', 'Lainnya'];
            document.getElementById('form-cat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        };

        window.copyMyId = () => {
            const temp = document.createElement('input'); temp.value = currentId;
            document.body.appendChild(temp); temp.select(); document.execCommand('copy');
            document.body.removeChild(temp); window.showToast("ID DISALIN");
        };

        window.switchId = () => {
            const val = document.getElementById('id-switcher').value;
            if (val.length !== 10) return alert("ID harus 10 digit");
            currentId = val;
            localStorage.setItem('np_active_id', val);
            sync(val);
            window.showToast("MENYAMBUNGKAN...");
            window.switchView('home');
        };

        window.exportDoc = (type) => {
            if (type === 'pdf') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.text("Laporan NiagaPintar PRO", 14, 20);
                doc.autoTable({ startY: 25, head: [['Tgl', 'Item', 'Tipe', 'Nominal']], body: window.records.map(r=>[r.date, r.desc, r.type, formatIDR(r.amount)]) });
                doc.save(`Laporan_${currentId}.pdf`);
            } else {
                const ws = XLSX.utils.json_to_sheet(window.records);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Data");
                XLSX.writeFile(wb, `Laporan_${currentId}.xlsx`);
            }
        };

        // FORM HANDLER
        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "MENYIMPAN...";

            const data = {
                desc: document.getElementById('form-desc').value,
                amount: parseFloat(document.getElementById('form-amount').value),
                type: document.getElementById('form-type').value,
                category: document.getElementById('form-cat').value,
                date: document.getElementById('form-date').value,
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(collection(db, `artifacts/${appId}/public/data/niaga_v7_${currentId}`), data);
                window.showToast("TERSINKRON");
                document.getElementById('main-form').reset();
                window.setType('income');
                window.switchView('history');
            } catch (err) {
                window.showToast("SIMPAN LOKAL");
                window.records.push({ id: 'L-'+Date.now(), ...data });
                localStorage.setItem('np_rec', JSON.stringify(window.records));
                window.renderUI();
                window.switchView('history');
            } finally {
                btn.disabled = false; btn.innerText = "SIMPAN KE CLOUD";
            }
        };

        // RUN
        window.setType('income');
        document.getElementById('form-date').valueAsDate = new Date();
        window.renderUI();
        initAuth();
        window.addEventListener('online', () => { window.showToast("ONLINE"); sync(currentId); });
        window.addEventListener('offline', () => { window.updateStatus(false); });
    </script>
</body>
</html>
