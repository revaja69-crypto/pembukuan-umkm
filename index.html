<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NiagaPintar PRO | Akuntansi Profesional</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Link ke Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11550/11550419.png">

    <!-- Pustaka Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Library untuk PDF & Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand: #4f46e5;
            --brand-light: #818cf8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            scroll-behavior: smooth;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px 0 rgba(31, 38, 135, 0.05);
        }

        .stat-card:active { transform: scale(0.98); transition: all 0.2s; }

        .btn-premium {
            background: var(--brand);
            box-shadow: 0 4px 12px 0 rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
        }

        .btn-premium:active { transform: scale(0.96); }

        /* Sembunyikan scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        input, select {
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-900 pb-16">

    <!-- Header / Navbar (Dibuat lebih ringkas) -->
    <header class="premium-gradient text-white sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-white/20 p-1.5 rounded-lg backdrop-blur-md">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight leading-none">NiagaPintar <span class="text-indigo-200 text-xs">PRO</span></h1>
                    <div id="offline-badge" class="hidden flex items-center gap-1 mt-0.5">
                        <span class="w-1 h-1 bg-emerald-400 rounded-full"></span>
                        <span class="text-[7px] font-bold uppercase tracking-widest text-emerald-300">Lokal</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="switchSection('settings')" class="p-1.5 hover:bg-white/10 rounded-lg transition-all">
                    <i data-lucide="settings-2" class="w-4 h-4 text-white/80"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-3 py-4 max-w-7xl">
        
        <!-- Dashboard Summary (Kompak & Berdampingan) -->
        <div class="grid grid-cols-3 gap-2 mb-4 animate-fade">
            <!-- Pemasukan -->
            <div class="glass-card stat-card p-2 rounded-xl relative overflow-hidden">
                <div class="absolute -right-1 -top-1 w-8 h-8 bg-emerald-500/10 rounded-full blur-lg"></div>
                <div class="flex items-center gap-1 mb-0.5">
                    <span class="text-[7px] font-bold text-slate-400 uppercase tracking-tighter">Masuk</span>
                </div>
                <h3 id="display-income" class="text-[9px] sm:text-sm font-extrabold text-emerald-600 truncate">Rp 0</h3>
            </div>
            
            <!-- Pengeluaran -->
            <div class="glass-card stat-card p-2 rounded-xl relative overflow-hidden">
                <div class="absolute -right-1 -top-1 w-8 h-8 bg-rose-500/10 rounded-full blur-lg"></div>
                <div class="flex items-center gap-1 mb-0.5">
                    <span class="text-[7px] font-bold text-slate-400 uppercase tracking-tighter">Keluar</span>
                </div>
                <h3 id="display-expense" class="text-[9px] sm:text-sm font-extrabold text-rose-600 truncate">Rp 0</h3>
            </div>

            <!-- Saldo -->
            <div class="stat-card p-2 rounded-xl bg-slate-900 text-white shadow-md overflow-hidden relative">
                <div class="absolute -right-1 -top-1 w-8 h-8 bg-indigo-500/20 rounded-full blur-lg"></div>
                <div class="flex items-center gap-1 mb-0.5">
                    <span class="text-[7px] font-bold text-slate-500 uppercase tracking-tighter">Saldo</span>
                </div>
                <h3 id="display-balance" class="text-[9px] sm:text-sm font-extrabold truncate text-indigo-100">Rp 0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Panel Kiri: Input -->
            <div class="lg:col-span-4 space-y-4">
                <div id="section-input" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-fade" style="animation-delay: 0.1s">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-sm font-extrabold text-slate-800">Input Data</h2>
                        <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-500"></i>
                    </div>
                    <form id="accounting-form" class="space-y-3">
                        <input type="hidden" id="edit-id">
                        
                        <div>
                            <label class="block text-[8px] font-bold text-slate-400 uppercase mb-1 ml-0.5">Keterangan</label>
                            <input type="text" id="desc" placeholder="Deskripsi..." required
                                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:bg-white focus:outline-none text-xs">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[8px] font-bold text-slate-400 uppercase mb-1 ml-0.5">Tipe</label>
                                <select id="type" onchange="filterFormCategories()" class="w-full px-2 py-2 bg-slate-50 border rounded-lg focus:outline-none text-xs cursor-pointer">
                                    <option value="income">Masuk</option>
                                    <option value="expense">Keluar</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[8px] font-bold text-slate-400 uppercase mb-1 ml-0.5">Nominal</label>
                                <input type="number" id="amount" placeholder="0" required
                                    class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:outline-none text-xs">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[8px] font-bold text-slate-400 uppercase mb-1 ml-0.5">Kategori</label>
                                <select id="category" class="w-full px-2 py-2 bg-slate-50 border rounded-lg focus:outline-none text-xs cursor-pointer"></select>
                            </div>
                            <div>
                                <label class="block text-[8px] font-bold text-slate-400 uppercase mb-1 ml-0.5">Tanggal</label>
                                <input type="date" id="date" required
                                    class="w-full px-2 py-2 bg-slate-50 border rounded-lg focus:outline-none text-xs">
                            </div>
                        </div>

                        <button type="submit" id="btn-submit" class="w-full btn-premium text-white font-bold py-2.5 rounded-lg shadow-md mt-1 text-xs">
                            Simpan Transaksi
                        </button>
                    </form>
                </div>

                <!-- Chart Box (Kompak) -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-fade hidden sm:block" style="animation-delay: 0.2s">
                    <h2 class="text-[10px] font-bold text-slate-800 mb-3">Distribusi Dana</h2>
                    <div class="h-32">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Panel Kanan: Daftar -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-full animate-fade" style="animation-delay: 0.3s">
                    
                    <div class="p-4 border-b border-slate-50">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <h2 class="text-sm font-extrabold text-slate-800">Riwayat</h2>
                            <div class="flex items-center gap-1.5">
                                <button onclick="exportToExcel()" class="p-1.5 bg-emerald-50 text-emerald-700 rounded-md border border-emerald-100" title="Excel">
                                    <i data-lucide="file-spreadsheet" class="w-3 h-3"></i>
                                </button>
                                <button onclick="exportToPDF()" class="p-1.5 bg-rose-50 text-rose-700 rounded-md border border-rose-100" title="PDF">
                                    <i data-lucide="file-text" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex gap-2">
                            <div class="relative flex-grow">
                                <i data-lucide="search" class="w-3 h-3 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-bar" placeholder="Cari..." 
                                    class="w-full pl-7 pr-3 py-1.5 bg-slate-50 border rounded-lg text-[10px] focus:outline-none">
                            </div>
                            <select id="filter-type" onchange="updateUI()" class="px-2 py-1.5 bg-slate-50 border rounded-lg text-[10px] font-bold text-slate-500 focus:outline-none">
                                <option value="all">Semua</option>
                                <option value="income">Masuk</option>
                                <option value="expense">Keluar</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex-grow overflow-x-auto">
                        <table class="w-full text-left" id="report-table">
                            <thead class="bg-slate-50/50 text-slate-400 text-[7px] uppercase font-black tracking-widest">
                                <tr>
                                    <th class="px-4 py-3">Tgl</th>
                                    <th class="px-4 py-3">Item</th>
                                    <th class="px-4 py-3 text-right">Nominal</th>
                                    <th class="px-4 py-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="list-container" class="divide-y divide-slate-100"></tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="no-data" class="hidden py-10 text-center">
                            <p class="text-slate-300 text-[10px] font-bold italic">Kosong</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Overlay Pengaturan -->
    <div id="section-settings" class="fixed inset-0 bg-slate-900/40 hidden z-[60] backdrop-blur-md p-4 flex items-center justify-center">
        <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl p-6 relative">
            <div class="absolute top-0 right-0 p-4">
                <button onclick="switchSection('input')"><i data-lucide="x" class="text-slate-300 w-4 h-4"></i></button>
            </div>
            
            <h2 class="text-base font-black text-slate-800 mb-4 flex items-center gap-2">
                <i data-lucide="sliders" class="text-indigo-600 w-4 h-4"></i> Pengaturan
            </h2>

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100 text-center">
                        <h3 class="text-[7px] font-black text-emerald-600 uppercase mb-2">Kategori Masuk</h3>
                        <div id="income-cat-list" class="space-y-1 mb-2 max-h-24 overflow-y-auto"></div>
                        <button onclick="addNewCategory('income')" class="w-full py-1.5 bg-emerald-600 text-white rounded-lg text-[8px] font-bold">TAMBAH</button>
                        <input type="text" id="new-income-cat" placeholder="Nama..." class="hidden">
                    </div>
                    <div class="p-3 bg-rose-50 rounded-xl border border-rose-100 text-center">
                        <h3 class="text-[7px] font-black text-rose-600 uppercase mb-2">Kategori Keluar</h3>
                        <div id="expense-cat-list" class="space-y-1 mb-2 max-h-24 overflow-y-auto"></div>
                        <button onclick="addNewCategory('expense')" class="w-full py-1.5 bg-rose-600 text-white rounded-lg text-[8px] font-bold">TAMBAH</button>
                        <input type="text" id="new-expense-cat" placeholder="Nama..." class="hidden">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="backupDatabase()" class="flex-1 py-2 bg-slate-100 rounded-lg text-[8px] font-bold text-slate-600">CADANGKAN</button>
                    <button onclick="confirmResetDB()" class="flex-1 py-2 bg-rose-600/10 rounded-lg text-[8px] font-bold text-rose-600">RESET</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-delete" class="fixed inset-0 bg-slate-900/40 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center">
            <h3 class="text-sm font-extrabold text-slate-800 mb-4">Hapus Data?</h3>
            <div class="flex gap-2">
                <button onclick="hideDeleteModal()" class="flex-1 py-2 border rounded-lg text-xs">Batal</button>
                <button id="btn-confirm-delete" class="flex-1 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="notification" class="fixed bottom-4 right-4 z-[110] translate-y-16 opacity-0 transition-all duration-300">
        <div class="bg-slate-900 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2">
            <i data-lucide="check" class="text-emerald-400 w-3 h-3"></i>
            <span id="notif-text" class="text-[9px] font-bold uppercase tracking-tight">Berhasil</span>
        </div>
    </div>

    <script>
        // --- DATABASE LOGIC ---
        const DB_NAME = 'UMKM_Smart_DB_v3';
        const STORE_NAME = 'transaksi';
        const STORE_CAT = 'kategori_v2';
        let db;

        const request = indexedDB.open(DB_NAME, 3);
        request.onsuccess = (e) => { 
            db = e.target.result; 
            document.getElementById('offline-badge').classList.remove('hidden');
            updateUI(); 
        };

        let records = [], categories = [], idToRemoval = null, chartInstance = null;
        
        const toIDR = (val) => new Intl.NumberFormat('id-ID', { 
            style: 'currency', currency: 'IDR', minimumFractionDigits: 0 
        }).format(val);

        const formatDate = (dateStr) => {
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' });
        };

        lucide.createIcons();
        document.getElementById('date').valueAsDate = new Date();

        async function fetchAll(storeName) {
            return new Promise((resolve) => {
                if (!db) return setTimeout(async () => resolve(await fetchAll(storeName)), 100);
                const tx = db.transaction([storeName], 'readonly');
                const req = tx.objectStore(storeName).getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        async function updateUI() {
            records = await fetchAll(STORE_NAME);
            categories = await fetchAll(STORE_CAT);
            
            renderCategoryManager();
            filterFormCategories();

            const query = document.getElementById('search-bar').value.toLowerCase();
            const selectedType = document.getElementById('filter-type').value;
            
            let filtered = records.filter(item => {
                const matchSearch = item.desc.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query));
                const matchType = selectedType === 'all' || item.type === selectedType;
                return matchSearch && matchType;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const listBody = document.getElementById('list-container');
            listBody.innerHTML = '';
            
            if (!filtered.length) {
                document.getElementById('no-data').classList.remove('hidden');
            } else {
                document.getElementById('no-data').classList.add('hidden');
                filtered.forEach(item => {
                    const isInc = item.type === 'income';
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-all group';
                    tr.innerHTML = `
                        <td class="px-4 py-3 text-[8px] font-bold text-slate-400">${formatDate(item.date)}</td>
                        <td class="px-4 py-3">
                            <span class="text-[10px] font-bold text-slate-800 block leading-tight truncate max-w-[80px]">${item.desc}</span>
                        </td>
                        <td class="px-4 py-3 text-right font-black text-[10px] ${isInc ? 'text-emerald-600' : 'text-rose-600'}">
                            ${toIDR(item.amount)}
                        </td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex justify-center gap-1">
                                <button onclick="editRecord('${item.id}')" class="p-1 text-indigo-400"><i data-lucide="edit-3" class="w-3 h-3"></i></button>
                                <button onclick="showDeleteModal('${item.id}')" class="p-1 text-rose-400"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                            </div>
                        </td>
                    `;
                    listBody.appendChild(tr);
                });
            }
            
            calculateStats();
            renderChart();
            lucide.createIcons();
        }

        function calculateStats() {
            const inc = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
            const exp = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
            document.getElementById('display-income').innerText = toIDR(inc);
            document.getElementById('display-expense').innerText = toIDR(exp);
            document.getElementById('display-balance').innerText = toIDR(inc - exp);
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const tableData = records.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => [
                r.date, r.desc, r.category, r.type === 'income' ? 'Masuk' : 'Keluar', toIDR(r.amount)
            ]);
            doc.autoTable({
                head: [['Tanggal', 'Item', 'Kategori', 'Tipe', 'Nominal']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [79, 70, 229] }
            });
            doc.save(`Laporan_${Date.now()}.pdf`);
            showNotification("PDF Siap");
        }

        function exportToExcel() {
            const worksheetData = [
                ['Tanggal', 'Item', 'Kategori', 'Tipe', 'Nominal'],
                ...records.map(r => [r.date, r.desc, r.category, r.type === 'income' ? 'Masuk' : 'Keluar', r.amount])
            ];
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Transaksi");
            XLSX.writeFile(wb, `Laporan_${Date.now()}.xlsx`);
            showNotification("Excel Siap");
        }

        function filterFormCategories() {
            const type = document.getElementById('type').value;
            const cats = categories.filter(c => c.type === type);
            document.getElementById('category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderCategoryManager() {
            const incomeList = document.getElementById('income-cat-list');
            const expenseList = document.getElementById('expense-cat-list');
            const itemUI = (c) => `
                <div class="flex justify-between items-center bg-white p-1 rounded-md text-[7px] font-bold">
                    <span>${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')"><i data-lucide="x" class="w-2 h-2 text-rose-300"></i></button>
                </div>
            `;
            incomeList.innerHTML = categories.filter(c => c.type === 'income').map(itemUI).join('');
            expenseList.innerHTML = categories.filter(c => c.type === 'expense').map(itemUI).join('');
            lucide.createIcons();
        }

        async function addNewCategory(type) {
            const val = prompt("Nama kategori baru:");
            if (!val) return;
            const tx = db.transaction([STORE_CAT], 'readwrite');
            tx.objectStore(STORE_CAT).add({ id: 'CAT-' + Date.now(), type, name: val });
            tx.oncomplete = () => updateUI();
        }

        function deleteCategory(id) {
            const tx = db.transaction([STORE_CAT], 'readwrite');
            tx.objectStore(STORE_CAT).delete(id);
            tx.oncomplete = () => updateUI();
        }

        document.getElementById('accounting-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value || 'TRX-' + Date.now();
            const data = {
                id,
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).put(data);
            tx.oncomplete = () => { resetForm(); updateUI(); showNotification("Tersimpan"); };
        });

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('desc').value = item.desc;
            document.getElementById('amount').value = item.amount;
            document.getElementById('type').value = item.type;
            filterFormCategories();
            document.getElementById('category').value = item.category;
            document.getElementById('date').value = item.date;
            document.getElementById('btn-submit').innerText = "Update";
        }

        function resetForm() {
            document.getElementById('accounting-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('btn-submit').innerText = "Simpan";
            document.getElementById('date').valueAsDate = new Date();
            filterFormCategories();
        }

        function switchSection(sec) {
            document.getElementById('section-settings').classList.toggle('hidden', sec !== 'settings');
        }

        function showDeleteModal(id) { idToRemoval = id; document.getElementById('modal-delete').classList.remove('hidden'); }
        function hideDeleteModal() { document.getElementById('modal-delete').classList.add('hidden'); }

        document.getElementById('btn-confirm-delete').addEventListener('click', () => {
            if (!idToRemoval) return;
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).delete(idToRemoval);
            tx.oncomplete = () => { updateUI(); hideDeleteModal(); showNotification("Terhapus"); };
        });

        function renderChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const cats = {};
            records.forEach(r => { if (r.type === 'income') cats[r.category] = (cats[r.category] || 0) + r.amount; });
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cats),
                    datasets: [{
                        data: Object.values(cats),
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        function showNotification(text) {
            const n = document.getElementById('notification');
            document.getElementById('notif-text').innerText = text;
            n.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => n.classList.add('translate-y-16', 'opacity-0'), 2000);
        }

        function backupDatabase() {
            const data = { records, categories };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Backup.json`; a.click();
        }

        function confirmResetDB() { if(confirm("Reset?")) { db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).clear(); updateUI(); } }

        document.getElementById('search-bar').addEventListener('input', updateUI);
    </script>
</body>
</html>
