<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NiagaPintar PRO | Akuntansi Profesional</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Link ke Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/11550/11550419.png">

    <!-- Pustaka Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Library untuk PDF & Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --brand: #4f46e5;
            --brand-light: #818cf8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            scroll-behavior: smooth;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .stat-card:hover { transform: translateY(-2px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .btn-premium {
            background: var(--brand);
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
        }

        .btn-premium:active { transform: scale(0.96); }

        /* Sembunyikan scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        input, select {
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen text-slate-900 pb-20">

    <!-- Header / Navbar -->
    <header class="premium-gradient text-white sticky top-0 z-50">
        <div class="container mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight leading-none">NiagaPintar <span class="text-indigo-200">PRO</span></h1>
                    <div id="offline-badge" class="hidden flex items-center gap-1 mt-0.5">
                        <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                        <span class="text-[8px] font-bold uppercase tracking-widest text-emerald-300">Lokal Aktif</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="switchSection('settings')" class="p-2 hover:bg-white/10 rounded-xl transition-all">
                    <i data-lucide="settings-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-7xl">
        
        <!-- Dashboard Summary (Kompak & Berdampingan untuk Mobile) -->
        <div class="grid grid-cols-3 gap-2 md:gap-4 mb-6 animate-fade">
            <!-- Pemasukan -->
            <div class="glass-card stat-card p-2.5 sm:p-4 rounded-2xl md:rounded-[2rem] relative overflow-hidden">
                <div class="absolute -right-2 -top-2 w-12 h-12 bg-emerald-500/10 rounded-full blur-xl"></div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 mb-1">
                    <div class="hidden sm:block bg-emerald-100 p-1.5 rounded-lg text-emerald-600">
                        <i data-lucide="trending-up" class="w-3 h-3"></i>
                    </div>
                    <span class="text-[7px] md:text-[9px] font-bold text-slate-500 uppercase tracking-wider leading-none">Masuk</span>
                </div>
                <h3 id="display-income" class="text-[10px] sm:text-base md:text-xl font-extrabold text-emerald-600 truncate">Rp 0</h3>
            </div>
            
            <!-- Pengeluaran -->
            <div class="glass-card stat-card p-2.5 sm:p-4 rounded-2xl md:rounded-[2rem] relative overflow-hidden">
                <div class="absolute -right-2 -top-2 w-12 h-12 bg-rose-500/10 rounded-full blur-xl"></div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 mb-1">
                    <div class="hidden sm:block bg-rose-100 p-1.5 rounded-lg text-rose-600">
                        <i data-lucide="trending-down" class="w-3 h-3"></i>
                    </div>
                    <span class="text-[7px] md:text-[9px] font-bold text-slate-500 uppercase tracking-wider leading-none">Keluar</span>
                </div>
                <h3 id="display-expense" class="text-[10px] sm:text-base md:text-xl font-extrabold text-rose-600 truncate">Rp 0</h3>
            </div>

            <!-- Saldo -->
            <div class="stat-card p-2.5 sm:p-4 rounded-2xl md:rounded-[2rem] bg-slate-900 text-white shadow-lg overflow-hidden relative">
                <div class="absolute -right-2 -top-2 w-12 h-12 bg-indigo-500/20 rounded-full blur-xl"></div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 mb-1">
                    <div class="hidden sm:block bg-white/10 p-1.5 rounded-lg text-indigo-400">
                        <i data-lucide="wallet" class="w-3 h-3"></i>
                    </div>
                    <span class="text-[7px] md:text-[9px] font-bold text-slate-400 uppercase tracking-wider leading-none">Saldo</span>
                </div>
                <h3 id="display-balance" class="text-[10px] sm:text-base md:text-xl font-extrabold truncate">Rp 0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Panel Kiri: Input -->
            <div class="lg:col-span-4 space-y-6">
                <div id="section-input" class="bg-white p-6 sm:p-8 rounded-[2rem] md:rounded-[2.5rem] shadow-sm border border-slate-100 animate-fade" style="animation-delay: 0.1s">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-base font-extrabold text-slate-800">Catat Transaksi</h2>
                        <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-500"></i>
                    </div>
                    <form id="accounting-form" class="space-y-4">
                        <input type="hidden" id="edit-id">
                        
                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Keterangan</label>
                            <input type="text" id="desc" placeholder="Contoh: Jual Bakso" required
                                class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:bg-white focus:outline-none text-sm transition-all">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Jenis</label>
                                <select id="type" onchange="filterFormCategories()" class="w-full px-3 py-3 bg-slate-50 border rounded-xl focus:outline-none text-sm cursor-pointer">
                                    <option value="income">Masuk</option>
                                    <option value="expense">Keluar</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Nominal</label>
                                <input type="number" id="amount" placeholder="0" required
                                    class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:outline-none text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Kategori</label>
                            <select id="category" class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:outline-none text-sm cursor-pointer"></select>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Tanggal</label>
                            <input type="date" id="date" required
                                class="w-full px-4 py-3 bg-slate-50 border rounded-xl focus:outline-none text-sm">
                        </div>

                        <button type="submit" id="btn-submit" class="w-full btn-premium text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 text-sm">
                            Simpan Transaksi
                        </button>
                    </form>
                </div>

                <!-- Chart Box -->
                <div class="bg-white p-6 sm:p-8 rounded-[2rem] md:rounded-[2.5rem] shadow-sm border border-slate-100 animate-fade" style="animation-delay: 0.2s">
                    <h2 class="text-xs font-bold text-slate-800 mb-4">Distribusi Pemasukan</h2>
                    <div class="h-48">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Panel Kanan: Daftar & Ekspor -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-[2rem] md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden flex flex-col h-full animate-fade" style="animation-delay: 0.3s">
                    
                    <div class="p-6 sm:p-8 border-b border-slate-50">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <h2 class="text-lg font-extrabold text-slate-800">Laporan Keuangan</h2>
                            <div class="flex items-center gap-2">
                                <button onclick="exportToExcel()" class="flex items-center gap-2 px-3 py-2 bg-emerald-50 text-emerald-700 rounded-lg text-[10px] font-bold border border-emerald-100 hover:bg-emerald-100">
                                    <i data-lucide="file-spreadsheet" class="w-3 h-3"></i> EXCEL
                                </button>
                                <button onclick="exportToPDF()" class="flex items-center gap-2 px-3 py-2 bg-rose-50 text-rose-700 rounded-lg text-[10px] font-bold border border-rose-100 hover:bg-rose-100">
                                    <i data-lucide="file-text" class="w-3 h-3"></i> PDF
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-5 flex flex-col md:flex-row gap-3">
                            <div class="relative flex-grow">
                                <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-bar" placeholder="Cari..." 
                                    class="w-full pl-9 pr-4 py-2 bg-slate-50 border rounded-xl text-xs focus:outline-none">
                            </div>
                            <select id="filter-type" onchange="updateUI()" class="px-3 py-2 bg-slate-50 border rounded-xl text-[10px] font-bold text-slate-500 uppercase focus:outline-none">
                                <option value="all">Semua</option>
                                <option value="income">Masuk</option>
                                <option value="expense">Keluar</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex-grow overflow-x-auto">
                        <table class="w-full text-left" id="report-table">
                            <thead class="bg-slate-50/50 text-slate-400 text-[8px] uppercase font-black tracking-widest">
                                <tr>
                                    <th class="px-6 py-4">Tgl</th>
                                    <th class="px-6 py-4">Item</th>
                                    <th class="px-6 py-4">Ktg</th>
                                    <th class="px-6 py-4 text-right">Nominal</th>
                                    <th class="px-6 py-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="list-container" class="divide-y divide-slate-100"></tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="no-data" class="hidden py-20 text-center">
                            <div class="bg-slate-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="layers" class="text-slate-200 w-8 h-8"></i>
                            </div>
                            <p class="text-slate-400 text-xs font-bold italic">Belum ada transaksi.</p>
                        </div>
                    </div>
                    
                    <div class="p-4 bg-slate-50/50 border-t border-slate-100 flex justify-between items-center">
                        <span id="record-count" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">0 Transaksi Tercatat</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Overlay Pengaturan -->
    <div id="section-settings" class="fixed inset-0 bg-slate-900/40 hidden z-[60] backdrop-blur-md p-6 flex items-center justify-center">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg shadow-2xl p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-6">
                <button onclick="switchSection('input')"><i data-lucide="x" class="text-slate-300 hover:text-slate-900 transition-all"></i></button>
            </div>
            
            <h2 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-3">
                <i data-lucide="sliders" class="text-indigo-600"></i> Pengaturan
            </h2>

            <div class="space-y-6">
                <!-- Kategori Manager -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                        <h3 class="text-[9px] font-black text-emerald-600 uppercase mb-3 tracking-widest">Masuk</h3>
                        <div id="income-cat-list" class="space-y-1.5 mb-3 max-h-32 overflow-y-auto pr-1"></div>
                        <div class="flex gap-1.5">
                            <input type="text" id="new-income-cat" placeholder="Nama..." class="w-full px-2 py-1.5 text-[10px] rounded-lg border-none focus:ring-1 focus:ring-emerald-500">
                            <button onclick="addNewCategory('income')" class="bg-emerald-600 text-white p-1.5 rounded-lg"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                    <div class="p-4 bg-rose-50 rounded-2xl border border-rose-100">
                        <h3 class="text-[9px] font-black text-rose-600 uppercase mb-3 tracking-widest">Keluar</h3>
                        <div id="expense-cat-list" class="space-y-1.5 mb-3 max-h-32 overflow-y-auto pr-1"></div>
                        <div class="flex gap-1.5">
                            <input type="text" id="new-expense-cat" placeholder="Nama..." class="w-full px-2 py-1.5 text-[10px] rounded-lg border-none focus:ring-1 focus:ring-rose-500">
                            <button onclick="addNewCategory('expense')" class="bg-rose-600 text-white p-1.5 rounded-lg"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Database Actions -->
                <div class="flex gap-3">
                    <button onclick="backupDatabase()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 rounded-xl text-[10px] font-bold text-slate-600 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i> BACKUP
                    </button>
                    <button onclick="confirmResetDB()" class="flex-1 py-3 bg-rose-600/10 hover:bg-rose-600 hover:text-white rounded-xl text-[10px] font-bold text-rose-600 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> RESET
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-delete" class="fixed inset-0 bg-slate-900/40 hidden z-[100] flex items-center justify-center backdrop-blur-sm p-6">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl text-center">
            <div class="bg-rose-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-rose-500">
                <i data-lucide="trash-2" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-800 mb-2">Hapus?</h3>
            <p class="text-slate-500 text-xs mb-6">Data ini akan hilang permanen.</p>
            <div class="flex gap-3">
                <button onclick="hideDeleteModal()" class="flex-1 py-3 border rounded-xl font-bold text-slate-400 text-sm">Batal</button>
                <button id="btn-confirm-delete" class="flex-1 py-3 bg-rose-600 text-white rounded-xl font-bold text-sm shadow-md">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="notification" class="fixed bottom-6 right-6 z-[110] translate-y-24 opacity-0 transition-all duration-500">
        <div class="bg-slate-900 text-white px-6 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-white/10">
            <i data-lucide="check" class="text-emerald-400 w-4 h-4"></i>
            <span id="notif-text" class="text-xs font-bold tracking-tight">Berhasil</span>
        </div>
    </div>

    <script>
        // --- DATABASE LOGIC (INDEXEDDB) ---
        const DB_NAME = 'UMKM_Smart_DB_v3';
        const STORE_NAME = 'transaksi';
        const STORE_CAT = 'kategori_v2';
        let db;

        const request = indexedDB.open(DB_NAME, 3);
        request.onsuccess = (e) => { 
            db = e.target.result; 
            document.getElementById('offline-badge').classList.remove('hidden');
            updateUI(); 
        };

        // --- STATE & UI HELPERS ---
        let records = [], categories = [], idToRemoval = null, chartInstance = null;
        
        const toIDR = (val) => new Intl.NumberFormat('id-ID', { 
            style: 'currency', currency: 'IDR', minimumFractionDigits: 0 
        }).format(val);

        const formatDate = (dateStr) => {
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' });
        };

        lucide.createIcons();
        document.getElementById('date').valueAsDate = new Date();

        // --- CRUD OPERATIONS ---
        async function fetchAll(storeName) {
            return new Promise((resolve) => {
                if (!db) return setTimeout(async () => resolve(await fetchAll(storeName)), 100);
                const tx = db.transaction([storeName], 'readonly');
                const req = tx.objectStore(storeName).getAll();
                req.onsuccess = () => resolve(req.result);
            });
        }

        async function updateUI() {
            records = await fetchAll(STORE_NAME);
            categories = await fetchAll(STORE_CAT);
            
            renderCategoryManager();
            filterFormCategories();

            const query = document.getElementById('search-bar').value.toLowerCase();
            const selectedType = document.getElementById('filter-type').value;
            
            let filtered = records.filter(item => {
                const matchSearch = item.desc.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query));
                const matchType = selectedType === 'all' || item.type === selectedType;
                return matchSearch && matchType;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const listBody = document.getElementById('list-container');
            listBody.innerHTML = '';
            
            if (!filtered.length) {
                document.getElementById('no-data').classList.remove('hidden');
            } else {
                document.getElementById('no-data').classList.add('hidden');
                filtered.forEach(item => {
                    const isInc = item.type === 'income';
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-all group';
                    tr.innerHTML = `
                        <td class="px-6 py-4 text-[9px] font-bold text-slate-400">${formatDate(item.date)}</td>
                        <td class="px-6 py-4">
                            <span class="text-xs font-bold text-slate-800 block leading-tight">${item.desc}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-1.5 py-0.5 rounded-md text-[7px] font-black uppercase tracking-tighter ${isInc ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                ${item.category || '-'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right font-black text-xs ${isInc ? 'text-emerald-600' : 'text-rose-600'}">
                            ${toIDR(item.amount)}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex justify-center gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100">
                                <button onclick="editRecord('${item.id}')" class="p-1.5 text-indigo-400"><i data-lucide="edit-3" class="w-3 h-3"></i></button>
                                <button onclick="showDeleteModal('${item.id}')" class="p-1.5 text-rose-400"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                            </div>
                        </td>
                    `;
                    listBody.appendChild(tr);
                });
            }
            
            document.getElementById('record-count').innerText = `${filtered.length} Transaksi`;
            calculateStats();
            renderChart();
            lucide.createIcons();
        }

        function calculateStats() {
            const inc = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
            const exp = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
            document.getElementById('display-income').innerText = toIDR(inc);
            document.getElementById('display-expense').innerText = toIDR(exp);
            document.getElementById('display-balance').innerText = toIDR(inc - exp);
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(20);
            doc.text("Laporan NiagaPintar PRO", 14, 22);
            const tableData = records.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => [
                r.date, r.desc, r.category, r.type === 'income' ? 'Masuk' : 'Keluar', toIDR(r.amount)
            ]);
            doc.autoTable({
                startY: 30,
                head: [['Tanggal', 'Keterangan', 'Kategori', 'Tipe', 'Nominal']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [79, 70, 229] }
            });
            doc.save(`Laporan_${Date.now()}.pdf`);
            showNotification("PDF Siap!");
        }

        function exportToExcel() {
            const worksheetData = [
                ['Tanggal', 'Keterangan', 'Kategori', 'Tipe', 'Nominal (IDR)'],
                ...records.map(r => [r.date, r.desc, r.category, r.type === 'income' ? 'Masuk' : 'Keluar', r.amount])
            ];
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Transaksi");
            XLSX.writeFile(wb, `Laporan_${Date.now()}.xlsx`);
            showNotification("Excel Siap!");
        }

        function filterFormCategories() {
            const type = document.getElementById('type').value;
            const cats = categories.filter(c => c.type === type);
            document.getElementById('category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderCategoryManager() {
            const incomeList = document.getElementById('income-cat-list');
            const expenseList = document.getElementById('expense-cat-list');
            const itemUI = (c) => `
                <div class="flex justify-between items-center bg-white p-1.5 rounded-lg shadow-sm border border-slate-100">
                    <span class="text-[9px] font-bold text-slate-600">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-rose-400"><i data-lucide="x-circle" class="w-3 h-3"></i></button>
                </div>
            `;
            incomeList.innerHTML = categories.filter(c => c.type === 'income').map(itemUI).join('');
            expenseList.innerHTML = categories.filter(c => c.type === 'expense').map(itemUI).join('');
            lucide.createIcons();
        }

        async function addNewCategory(type) {
            const id = type === 'income' ? 'new-income-cat' : 'new-expense-cat';
            const val = document.getElementById(id).value.trim();
            if (!val) return;
            const tx = db.transaction([STORE_CAT], 'readwrite');
            tx.objectStore(STORE_CAT).add({ id: 'CAT-' + Date.now(), type, name: val });
            tx.oncomplete = () => { document.getElementById(id).value = ''; updateUI(); };
        }

        function deleteCategory(id) {
            const tx = db.transaction([STORE_CAT], 'readwrite');
            tx.objectStore(STORE_CAT).delete(id);
            tx.oncomplete = () => updateUI();
        }

        document.getElementById('accounting-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value || 'TRX-' + Date.now();
            const data = {
                id,
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).put(data);
            tx.oncomplete = () => { resetForm(); updateUI(); showNotification("Data Disimpan"); };
        });

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('desc').value = item.desc;
            document.getElementById('amount').value = item.amount;
            document.getElementById('type').value = item.type;
            filterFormCategories();
            document.getElementById('category').value = item.category;
            document.getElementById('date').value = item.date;
            document.getElementById('btn-submit').innerText = "Update";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('accounting-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('btn-submit').innerText = "Simpan Transaksi";
            document.getElementById('date').valueAsDate = new Date();
            filterFormCategories();
        }

        function switchSection(sec) {
            document.getElementById('section-settings').classList.toggle('hidden', sec !== 'settings');
        }

        function showDeleteModal(id) { idToRemoval = id; document.getElementById('modal-delete').classList.remove('hidden'); }
        function hideDeleteModal() { document.getElementById('modal-delete').classList.add('hidden'); }

        document.getElementById('btn-confirm-delete').addEventListener('click', () => {
            if (!idToRemoval) return;
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).delete(idToRemoval);
            tx.oncomplete = () => { updateUI(); hideDeleteModal(); showNotification("Data Terhapus"); };
        });

        function renderChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const cats = {};
            records.forEach(r => { if (r.type === 'income') cats[r.category] = (cats[r.category] || 0) + r.amount; });
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cats),
                    datasets: [{
                        data: Object.values(cats),
                        backgroundColor: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '80%' }
            });
        }

        function showNotification(text) {
            const n = document.getElementById('notification');
            document.getElementById('notif-text').innerText = text;
            n.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => n.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        function backupDatabase() {
            const data = { records, categories };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Backup_${Date.now()}.json`; a.click();
        }

        function confirmResetDB() { if(confirm("Hapus semua?")) { db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).clear(); updateUI(); } }

        document.getElementById('search-bar').addEventListener('input', updateUI);

        if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
