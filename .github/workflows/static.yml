# Workflow Deployment NiagaPintar PRO v7.5.7
# Solusi untuk error "Multiple artifacts found: Artifact count is 3"
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Menyatukan build dan deploy dalam satu job untuk menghindari duplikasi metadata
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Langkah ini memastikan GitHub tahu kita tidak menggunakan Jekyll
      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Menggunakan path spesifik untuk menghindari pemindaian ganda
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
