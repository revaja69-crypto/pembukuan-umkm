# Workflow Deployment NiagaPintar PRO v7.5.4
# Perbaikan Final untuk error "Multiple artifacts found"
name: Deploy to GitHub Pages

on:
  # Berjalan otomatis saat ada perubahan di branch main
  push:
    branches: ["main"]
  # Memungkinkan menjalankan secara manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah penumpukan proses: Membatalkan deployment lama jika ada yang baru
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pastikan hanya mengunggah folder saat ini
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
