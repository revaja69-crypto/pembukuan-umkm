# Workflow Deployment NiagaPintar PRO v7.5.5
# Solusi Defensif untuk error "Multiple artifacts found"
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Konfigurasi Concurrency yang lebih ketat untuk membersihkan antrean
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Menggunakan jalur absolut eksplisit untuk menghindari duplikasi scanning
          path: './'
          # Memberikan nama unik jika diperlukan, namun Pages default mencari 'github-pages'
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        # Menggunakan v4 yang lebih stabil untuk menghindari bug metadata pada v5
        uses: actions/deploy-pages@v4
